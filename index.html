<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trang Tran | Information Management Portfolio</title>
    <meta
        name="description"
        content="Trang Tran - Information Management student with experience in cataloguing, digital information systems and data-oriented workflows."
    >

    <style>
        :root {
            --bg: #f5f7fb;
            --surface: rgba(255, 255, 255, 0.88);
            --surface-solid: #ffffff;
            --text: #172033;
            --muted: #667085;
            --line: #e5e9f0;

            --primary: #315efb;
            --primary-dark: #2448c7;
            --primary-soft: #eef3ff;

            --success-soft: #edf9f3;
            --success: #18794e;

            --shadow-sm: 0 8px 25px rgba(23, 32, 51, 0.05);
            --shadow-lg: 0 20px 60px rgba(23, 32, 51, 0.08);

            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 28px;

            --max-width: 1120px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background:
                radial-gradient(circle at top left, rgba(49, 94, 251, 0.08), transparent 28%),
                radial-gradient(circle at 90% 15%, rgba(91, 123, 255, 0.08), transparent 24%),
                var(--bg);
            color: var(--text);
            line-height: 1.7;
        }

        a {
            color: inherit;
        }

        .page {
            width: min(100% - 36px, var(--max-width));
            margin: 0 auto;
        }

        /* =========================
           NAVIGATION
        ========================== */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            background: rgba(245, 247, 251, 0.82);
            border-bottom: 1px solid rgba(229, 233, 240, 0.8);
        }

        .nav-inner {
            width: min(100% - 36px, var(--max-width));
            margin: 0 auto;

            min-height: 74px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            text-decoration: none;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .brand span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--muted);
            font-size: 0.92rem;
            transition: 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .language-switch {
            display: flex;
            gap: 4px;

            background: #fff;
            border: 1px solid var(--line);
            padding: 4px;
            border-radius: 999px;
            box-shadow: var(--shadow-sm);
        }

        .language-switch button {
            border: 0;
            background: transparent;
            color: var(--muted);
            border-radius: 999px;
            padding: 7px 11px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .language-switch button.active {
            background: var(--text);
            color: white;
        }

        /* =========================
           HERO
        ========================== */

        .hero {
            min-height: 78vh;
            display: grid;
            grid-template-columns: 1.25fr 0.75fr;
            gap: 56px;
            align-items: center;
            padding: 90px 0 80px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 7px 12px;
            border-radius: 999px;
            background: var(--primary-soft);
            color: var(--primary-dark);

            font-size: 0.78rem;
            font-weight: 750;
            letter-spacing: 0.03em;
            margin-bottom: 20px;
        }

        .eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
        }

        .hero h1 {
            font-size: clamp(3rem, 7vw, 5.4rem);
            line-height: 0.98;
            letter-spacing: -0.065em;
            margin-bottom: 24px;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero-description {
            max-width: 680px;
            color: var(--muted);
            font-size: 1.08rem;
            margin-bottom: 30px;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            min-height: 46px;
            padding: 0 18px;
            border-radius: 12px;

            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 700;

            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button-primary {
            background: var(--text);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .button-primary:hover {
            background: #0e1421;
            box-shadow: var(--shadow-lg);
        }

        .button-secondary {
            background: white;
            border: 1px solid var(--line);
        }

        .hero-card {
            position: relative;
            padding: 28px;
            background:
                linear-gradient(145deg, rgba(255,255,255,0.96), rgba(245,247,255,0.96));
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
        }

        .hero-card::before {
            content: "";
            position: absolute;
            top: -28px;
            right: -28px;

            width: 110px;
            height: 110px;

            border-radius: 50%;
            background: rgba(49, 94, 251, 0.11);
            filter: blur(2px);
        }

        .hero-card-label {
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 18px;
        }

        .focus-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
        }

        .focus-item:last-child {
            border-bottom: 0;
        }

        .focus-item strong {
            display: block;
            font-size: 0.95rem;
            margin-bottom: 3px;
        }

        .focus-item span {
            color: var(--muted);
            font-size: 0.88rem;
        }

.hero-visual {
    position: relative;
    min-height: 570px;

    display: flex;
    align-items: flex-end;
    justify-content: center;
}

.hero-glow {
    position: absolute;

    width: 430px;
    height: 430px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(49, 94, 251, 0.20) 0%,
            rgba(49, 94, 251, 0.09) 45%,
            rgba(49, 94, 251, 0) 72%
        );

    filter: blur(4px);

    top: 48%;
    left: 50%;

    transform: translate(-50%, -50%);
}

.hero-circle {
    position: absolute;

    width: 380px;
    height: 380px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #dfe7ff,
            #c8d5ff
        );

    bottom: 35px;
    left: 50%;

    transform: translateX(-50%);

    box-shadow:
        inset 0 0 50px rgba(255,255,255,0.55),
        0 25px 70px rgba(49,94,251,0.12);
}

.hero-photo {
    position: relative;
    z-index: 4;

    display: block;

    width: 410px;
    max-width: 95%;
    height: auto;

    object-fit: contain;

    filter:
        drop-shadow(
            0 25px 28px rgba(20, 28, 45, 0.16)
        );

    opacity: 0;

    transform: translateX(100px) translateY(10px);

    animation:
        heroPhotoIn 1s cubic-bezier(.22,.8,.3,1)
        0.15s forwards;
}

@keyframes heroPhotoIn {
    from {
        opacity: 0;
        transform:
            translateX(100px)
            translateY(10px)
            scale(0.97);
    }

    to {
        opacity: 1;
        transform:
            translateX(0)
            translateY(0)
            scale(1);
    }
}

.floating-card {
    position: absolute;
    z-index: 8;

    background: rgba(255,255,255,0.90);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border: 1px solid rgba(255,255,255,0.8);

    box-shadow:
        0 18px 45px rgba(23,32,51,0.10);

    border-radius: 16px;

    padding: 14px 17px;

    animation:
        floatingCardIn
        0.8s ease
        0.55s both;
}

.floating-card-top {
    top: 90px;
    right: 8px;
    min-width: 180px;
}

.floating-card-bottom {
    bottom: 65px;
    left: 8px;

    display: flex;
    align-items: center;

    gap: 10px;

    min-width: 225px;
}

.floating-label {
    display: block;

    color: var(--primary);

    font-size: 0.68rem;
    font-weight: 800;

    letter-spacing: 0.10em;
    text-transform: uppercase;

    margin-bottom: 4px;
}

.floating-card strong {
    display: block;

    color: var(--text);
    font-size: 0.88rem;
}

.floating-card-bottom small {
    display: block;

    color: var(--muted);
    font-size: 0.72rem;

    margin-top: 2px;
}

.floating-dot {
    width: 9px;
    height: 9px;

    flex: 0 0 auto;

    border-radius: 50%;

    background: #31b77a;

    box-shadow:
        0 0 0 5px rgba(49,183,122,0.10);
}

@keyframes floatingCardIn {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

        /* =========================
           GENERAL
        ========================== */

        section {
            padding: 86px 0;
            scroll-margin-top: 90px;
        }

        .section-heading {
            margin-bottom: 34px;
        }

        .section-kicker {
            display: block;
            color: var(--primary);
            font-weight: 800;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .section-heading h2 {
            font-size: clamp(2rem, 4vw, 3rem);
            letter-spacing: -0.045em;
            line-height: 1.05;
            margin-bottom: 10px;
        }

        .section-heading p {
            max-width: 700px;
            color: var(--muted);
        }

        .two-column {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 32px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            padding: 28px;
        }

        .card + .card {
            margin-top: 18px;
        }

        .card h3 {
            font-size: 1.15rem;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .card-meta {
            color: var(--primary);
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .muted {
            color: var(--muted);
        }

        /* =========================
           ABOUT
        ========================== */

        .about-text {
            font-size: 1.04rem;
            color: #384152;
        }

        .principles {
            display: grid;
            gap: 12px;
        }

        .principle {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            padding: 15px;
            border-radius: 14px;
            background: #f8faff;
            border: 1px solid #e6ebfb;
        }

        .principle-number {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;

            border-radius: 10px;
            background: var(--primary);
            color: white;

            font-size: 0.76rem;
            font-weight: 800;
        }

        .principle strong {
            display: block;
            margin-bottom: 2px;
        }

        .principle span {
            color: var(--muted);
            font-size: 0.88rem;
        }

        /* =========================
           EDUCATION
        ========================== */

        .education-card {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 20px;
            align-items: flex-start;
        }

        .education-icon {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;

            border-radius: 16px;
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 900;
        }

        .education-card h3 {
            margin-bottom: 5px;
        }

        .education-card .school {
            color: var(--muted);
            margin-bottom: 6px;
        }

        /* =========================
           EXPERIENCE
        ========================== */

        .timeline {
            position: relative;
            margin-left: 8px;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;

            width: 1px;
            background: var(--line);
        }

        .timeline-item {
            position: relative;
            padding-left: 38px;
            margin-bottom: 30px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: 0;
            top: 7px;

            width: 17px;
            height: 17px;

            border-radius: 50%;
            background: var(--primary);
            border: 4px solid var(--bg);
            box-shadow: 0 0 0 1px rgba(49, 94, 251, 0.2);
        }

        .experience-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 26px;
            box-shadow: var(--shadow-sm);
        }

        .experience-card h3 {
            font-size: 1.18rem;
            margin-bottom: 5px;
        }

        .role {
            color: var(--primary);
            font-weight: 700;
            font-size: 0.86rem;
            margin-bottom: 16px;
        }

        .experience-card ul {
            padding-left: 19px;
            color: #3f4858;
        }

        .experience-card li + li {
            margin-top: 8px;
        }

        .experience-note {
            margin-top: 16px;
            padding: 14px 16px;
            border-left: 3px solid var(--primary);
            background: var(--primary-soft);
            border-radius: 0 10px 10px 0;
            color: #344166;
            font-size: 0.9rem;
        }

        /* =========================
           SKILLS
        ========================== */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .skill-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 23px;
        }

        .skill-card h3 {
            font-size: 0.95rem;
            margin-bottom: 14px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            padding: 7px 11px;
            border-radius: 999px;
            background: #f8f9fc;
            border: 1px solid var(--line);
            color: #465064;
            font-size: 0.79rem;
        }

        /* =========================
           CERTIFICATES
        ========================== */

        .certificate-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .certificate-card {
            position: relative;
            overflow: hidden;

            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 26px;
            box-shadow: var(--shadow-sm);
        }

        .certificate-card::after {
            content: "";
            position: absolute;
            right: -25px;
            bottom: -25px;

            width: 85px;
            height: 85px;

            border-radius: 50%;
            background: var(--primary-soft);
        }

        .certificate-card h3 {
            margin-bottom: 7px;
        }

        .certificate-card p {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .certificate-link {
            display: inline-flex;
            margin-top: 16px;
            color: var(--primary-dark);
            font-size: 0.83rem;
            font-weight: 750;
            text-decoration: none;
        }

        .certificate-link:hover {
            text-decoration: underline;
        }

        /* =========================
           CONTACT
        ========================== */

        .contact-box {
            background:
                linear-gradient(145deg, #182137, #26375d);
            color: white;
            border-radius: var(--radius-lg);
            padding: 44px;
            box-shadow: var(--shadow-lg);

            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 35px;
            align-items: center;
        }

        .contact-box .section-kicker {
            color: #aebeff;
        }

        .contact-box h2 {
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
            margin-bottom: 14px;
        }

        .contact-box p {
            color: #d5dbeb;
            max-width: 620px;
        }

        .contact-info {
            display: grid;
            gap: 10px;
        }

        .contact-info a {
            text-decoration: none;
            color: white;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
        }

        .contact-info a:hover {
            background: rgba(255,255,255,0.09);
        }

        /* =========================
           FOOTER
        ========================== */

        footer {
            padding: 30px 0 45px;
            color: var(--muted);
            font-size: 0.82rem;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            border-top: 1px solid var(--line);
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 880px) {
            .nav-links {
                display: none;
            }

            .hero {
                grid-template-columns: 1fr;
                min-height: auto;
                padding-top: 65px;
            }

            .two-column,
            .contact-box,
            .certificate-grid,
            .skills-grid {
                grid-template-columns: 1fr;
            }

            .contact-box {
                padding: 30px;
            }
        }

        @media (max-width: 560px) {
            .page,
            .nav-inner {
                width: min(100% - 24px, var(--max-width));
            }

            .hero {
                padding: 52px 0 50px;
            }

            section {
                padding: 58px 0;
            }

            .hero h1 {
                font-size: 3rem;
            }

            .hero-card,
            .card,
            .experience-card,
            .certificate-card {
                padding: 21px;
            }

            footer {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<script>

    function setLanguage(lang) {

        document.documentElement.lang = lang;

        document.querySelectorAll("[data-vi]").forEach(function (element) {

            const content = element.getAttribute("data-" + lang);

            if (content !== null) {
                element.textContent = content;
            }

        });


        document.getElementById("btn-vi")
            .classList.toggle("active", lang === "vi");

        document.getElementById("btn-en")
            .classList.toggle("active", lang === "en");


        localStorage.setItem("preferredLanguage", lang);
    }


    // Load saved language
    const savedLanguage = localStorage.getItem("preferredLanguage") || "vi";

    setLanguage(savedLanguage);

</script>
